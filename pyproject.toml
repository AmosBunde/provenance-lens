[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "provenance-lens"
version = "0.1.0"
description = "Multimodal authenticity reasoner: forensic signals, VLM reasoning, frozen benchmark"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Amos Bunde" }]
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "pandas>=2.0",
    "pyarrow>=15.0",
    "pillow>=10.0",
    "imagehash>=4.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "black>=24.0",
    "pre-commit>=3.7",
]

[project.urls]
Repository = "https://github.com/AmosBunde/provenance-lens"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
